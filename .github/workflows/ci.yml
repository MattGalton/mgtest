name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mgtest-core
          - mgtest-docker
          - mgtest-redis
          - mgtest-sql
          - mgtest-s3
          - mgtest-nats
          - mgtest-lsp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --group dev
      - run: uv run --package ${{ matrix.package }} pytest -q src/${{ matrix.package }}/tests
      - run: uv build --package ${{ matrix.package }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
