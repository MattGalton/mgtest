name: CI

on:
  push:
  pull_request:

jobs:
  test-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mgtest-core
          - mgtest-docker
          - mgtest-redis
          - mgtest-sql
          - mgtest-s3
          - mgtest-nats
          - mgtest-lsp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --group dev
      - run: uv run --package ${{ matrix.package }} pytest -q src/${{ matrix.package }}/tests
      - run: uv build --package ${{ matrix.package }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
