<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">An mgtest dependency graph</title><desc id="desc">A service resource supports health and import checks; the import check provides output to a validation check. Every activity saves evidence to a run workspace.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#94a3b8"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172554}.line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#a)}.label{font-size:17px;font-weight:700}.sub{font-size:13px;fill:#475569}.pill{font-size:12px;font-weight:700;fill:#fff}</style></defs><rect width="1100" height="430" rx="24" fill="#f8fafc"/><text x="58" y="64" font-family="Inter,-apple-system,sans-serif" font-size="25" font-weight="750" fill="#172554">One graph makes order and purpose visible</text><path class="line" d="M286 194H400M286 194C350 194 342 300 400 300M590 300H706M590 194C650 194 646 300 706 300M880 255H960"/><g><rect x="58" y="143" width="228" height="102" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="76" y="160" width="85" height="24" rx="12" fill="#16a34a"/><text class="pill" x="118" y="177" text-anchor="middle">RESOURCE</text><text class="label" x="76" y="210">api service</text><text class="sub" x="76" y="231">starts once for the suite</text></g><g><rect x="400" y="143" width="190" height="102" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="418" y="160" width="58" height="24" rx="12" fill="#2563eb"/><text class="pill" x="447" y="177" text-anchor="middle">CHECK</text><text class="label" x="418" y="210">health</text><text class="sub" x="418" y="231">HTTP is ready</text></g><g><rect x="400" y="249" width="190" height="102" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="418" y="266" width="58" height="24" rx="12" fill="#2563eb"/><text class="pill" x="447" y="283" text-anchor="middle">CHECK</text><text class="label" x="418" y="316">import</text><text class="sub" x="418" y="337">creates a report</text></g><g><rect x="706" y="249" width="174" height="102" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="724" y="266" width="58" height="24" rx="12" fill="#2563eb"/><text class="pill" x="753" y="283" text-anchor="middle">CHECK</text><text class="label" x="724" y="316">validate</text><text class="sub" x="724" y="337">uses report output</text></g><g><rect x="960" y="204" width="100" height="102" rx="15" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="1010" y="245" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#9d174d">run</text><text x="1010" y="267" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#9d174d">evidence</text></g></svg>
