<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Run evidence structure</title><desc id="desc">An mgtest run directory contains the manifest, resolved configuration, test outputs and failures, and resource logs.</desc><defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172554}.h{font-size:24px;font-weight:750}.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:650}.note{font-size:14px;fill:#475569}</style></defs><rect width="1100" height="360" rx="24" fill="#f8fafc"/><text class="h" x="58" y="62">A run leaves a complete trail</text><rect x="58" y="96" width="984" height="208" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><path d="M96 140h15l9 10h124v30H96z" fill="#fbbf24"/><text class="path" x="260" y="164">.mgtest/runs/2026-…/</text><path d="M151 184v78M151 202h58M151 224h58M151 246h58M424 202h78M424 224h96M424 246h86M731 202h86M731 224h105" stroke="#94a3b8" stroke-width="2"/><text class="path" x="222" y="207">manifest.json</text><text class="note" x="530" y="207">what ran and how it ended</text><text class="path" x="222" y="229">resolved-config.yaml</text><text class="note" x="530" y="229">the exact configuration used</text><text class="path" x="222" y="251">tests/</text><text class="note" x="530" y="251">outputs.json and failure.txt</text><text class="path" x="222" y="273">resources/</text><text class="note" x="530" y="273">captured logs for diagnosis</text><rect x="843" y="183" width="160" height="70" rx="14" fill="#ede9fe"/><text x="923" y="212" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Upload in CI</text><text x="923" y="234" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="13" fill="#6d28d9">when a job fails</text></svg>
