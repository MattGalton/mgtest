<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">What is mgtest</title><desc id="desc">mgtest is a declarative integration-test framework for pytest. Define resources, checks, and expectations in YAML, then run them as ordinary pytest tests.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312e81" flood-opacity=".10"/></filter><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172554}.eyebrow{font-size:13px;font-weight:750;letter-spacing:2px;fill:#4f46e5}.heading{font-size:27px;font-weight:750}.detail{font-size:17px;fill:#475569}</style></defs><rect width="960" height="270" rx="26" fill="url(#bg)"/><g filter="url(#shadow)"><rect x="55" y="45" width="850" height="180" rx="20" fill="#fff"/><text class="eyebrow" x="95" y="86">WHAT</text><text class="heading" x="95" y="126">A declarative integration-test framework for pytest.</text><text class="detail" x="95" y="162">Define resources, checks, and expectations in YAML.</text><text class="detail" x="95" y="190">Run them as ordinary pytest tests.</text></g></svg>
