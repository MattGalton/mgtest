<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Why use mgtest</title><desc id="desc">mgtest lets teams write only the tests they need, version test definitions and expectations with code, reproduce the same test setup locally and in CI, and keep useful evidence from failures.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312e81" flood-opacity=".10"/></filter><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172554}.eyebrow{font-size:13px;font-weight:750;letter-spacing:2px;fill:#4f46e5}.heading{font-size:27px;font-weight:750}.title{font-size:19px;font-weight:750}.detail{font-size:14px;fill:#475569}.number{font-size:13px;font-weight:800;fill:#fff}</style></defs><rect width="960" height="560" rx="26" fill="url(#bg)"/><text class="eyebrow" x="55" y="57">WHY</text><text class="heading" x="55" y="96">Integration tests that are easy to write, run, and trust.</text><g filter="url(#shadow)"><rect x="55" y="133" width="408" height="166" rx="18" fill="#fff"/><circle cx="87" cy="166" r="16" fill="#4f46e5"/><text class="number" x="87" y="171" text-anchor="middle">1</text><text class="title" x="124" y="174">Write only what you need</text><text class="detail" x="80" y="215">Describe the behaviour under test</text><text class="detail" x="80" y="237">without bespoke fixture orchestration.</text></g><g filter="url(#shadow)"><rect x="497" y="133" width="408" height="166" rx="18" fill="#fff"/><circle cx="529" cy="166" r="16" fill="#4f46e5"/><text class="number" x="529" y="171" text-anchor="middle">2</text><text class="title" x="566" y="174">Version tests with code</text><text class="detail" x="522" y="215">Keep definitions and expectations</text><text class="detail" x="522" y="237">in every review and release.</text></g><g filter="url(#shadow)"><rect x="55" y="333" width="408" height="166" rx="18" fill="#fff"/><circle cx="87" cy="366" r="16" fill="#4f46e5"/><text class="number" x="87" y="371" text-anchor="middle">3</text><text class="title" x="124" y="374">Reproducible environments</text><text class="detail" x="80" y="415">Use the same pytest command and</text><text class="detail" x="80" y="437">checked-in setup locally and in CI.</text></g><g filter="url(#shadow)"><rect x="497" y="333" width="408" height="166" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><circle cx="529" cy="366" r="16" fill="#8b5cf6"/><text class="number" x="529" y="371" text-anchor="middle">4</text><text x="566" y="374" font-family="Inter,-apple-system,sans-serif" font-size="19" font-weight="750" fill="#4c1d95">Useful failures</text><text x="522" y="415" font-family="Inter,-apple-system,sans-serif" font-size="14" fill="#6d28d9">Start only needed resources; keep</text><text x="522" y="437" font-family="Inter,-apple-system,sans-serif" font-size="14" fill="#6d28d9">outputs, logs, and failure detail.</text></g></svg>
