<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">How an mgtest run works</title><desc id="desc">First define resources and checks in YAML. mgtest then plans their dependencies, runs the required resources and checks through pytest or its CLI, and saves run evidence.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312e81" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#94a3b8"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172554}.eyebrow{font-size:13px;font-weight:750;letter-spacing:2px;fill:#4f46e5}.heading{font-size:28px;font-weight:750}.title{font-size:20px;font-weight:750}.detail{font-size:14px;fill:#475569}.number{font-size:13px;font-weight:800;fill:#fff}.arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1100" height="500" rx="26" fill="url(#bg)"/><text class="eyebrow" x="55" y="57">ONE MGTEST RUN</text><text class="heading" x="55" y="96">Define the behaviour. Let mgtest handle the order.</text><path class="arrow" d="M505 193H595M850 280V347M595 402H505"/><g filter="url(#shadow)"><rect x="55" y="137" width="450" height="112" rx="18" fill="#fff"/><circle cx="88" cy="170" r="16" fill="#4f46e5"/><text class="number" x="88" y="175" text-anchor="middle">1</text><text class="title" x="125" y="177">Define in YAML</text><text class="detail" x="125" y="207">Resources, checks, variables, and expectations.</text></g><g filter="url(#shadow)"><rect x="595" y="137" width="450" height="112" rx="18" fill="#fff"/><circle cx="628" cy="170" r="16" fill="#4f46e5"/><text class="number" x="628" y="175" text-anchor="middle">2</text><text class="title" x="665" y="177">Plan dependencies</text><text class="detail" x="665" y="207">Validate the project and select required work.</text></g><g filter="url(#shadow)"><rect x="595" y="347" width="450" height="112" rx="18" fill="#fff"/><circle cx="628" cy="380" r="16" fill="#4f46e5"/><text class="number" x="628" y="385" text-anchor="middle">3</text><text class="title" x="665" y="387">Run resources and checks</text><text class="detail" x="665" y="417">Use pytest or the mgtest CLI.</text></g><g filter="url(#shadow)"><rect x="55" y="347" width="450" height="112" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><circle cx="88" cy="380" r="16" fill="#8b5cf6"/><text class="number" x="88" y="385" text-anchor="middle">4</text><text x="125" y="387" font-family="Inter,-apple-system,sans-serif" font-size="20" font-weight="750" fill="#4c1d95">Inspect run evidence</text><text x="125" y="417" font-family="Inter,-apple-system,sans-serif" font-size="14" fill="#6d28d9">Saved outputs, logs, and failure details.</text></g></svg>
