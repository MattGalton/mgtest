<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">How an mgtest run works</title><desc id="desc">YAML definitions are planned into a dependency graph. mgtest starts resources, runs checks through pytest or its CLI, and saves run evidence.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312e81" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#94a3b8"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172554}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#4f46e5}.heading{font-size:32px;font-weight:750}.card-title{font-size:18px;font-weight:700}.detail{font-size:14px;fill:#475569}.number{font-size:13px;font-weight:800;fill:#fff}.arrow{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="470" rx="28" fill="url(#bg)"/><text class="eyebrow" x="70" y="70">SYSTEM TESTING, MADE EXPLICIT</text><text class="heading" x="70" y="112">From a behaviour you can read to evidence you can use.</text><path class="arrow" d="M264 266H326"/><path class="arrow" d="M550 266H612"/><path class="arrow" d="M836 266H898"/><g filter="url(#shadow)"><rect x="70" y="184" width="194" height="172" rx="18" fill="#fff"/><circle cx="99" cy="213" r="15" fill="#4f46e5"/><text class="number" x="99" y="218" text-anchor="middle">1</text><text class="card-title" x="94" y="258">Describe behaviour</text><text class="detail" x="94" y="285">YAML resources, checks,</text><text class="detail" x="94" y="306">variables, and outputs.</text></g><g filter="url(#shadow)"><rect x="326" y="184" width="224" height="172" rx="18" fill="#fff"/><circle cx="355" cy="213" r="15" fill="#4f46e5"/><text class="number" x="355" y="218" text-anchor="middle">2</text><text class="card-title" x="350" y="258">Plan dependencies</text><text class="detail" x="350" y="285">mgtest validates the project</text><text class="detail" x="350" y="306">and orders only needed work.</text></g><g filter="url(#shadow)"><rect x="612" y="184" width="224" height="172" rx="18" fill="#fff"/><circle cx="641" cy="213" r="15" fill="#4f46e5"/><text class="number" x="641" y="218" text-anchor="middle">3</text><text class="card-title" x="636" y="258">Run with confidence</text><text class="detail" x="636" y="285">Resources start when needed;</text><text class="detail" x="636" y="306">pytest reports each check.</text></g><g filter="url(#shadow)"><rect x="898" y="184" width="232" height="172" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><circle cx="927" cy="213" r="15" fill="#8b5cf6"/><text class="number" x="927" y="218" text-anchor="middle">4</text><text x="922" y="258" font-family="Inter,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#4c1d95">Keep the evidence</text><text x="922" y="285" font-family="Inter,-apple-system,sans-serif" font-size="14" fill="#6d28d9">Outputs, logs, and failures</text><text x="922" y="306" font-family="Inter,-apple-system,sans-serif" font-size="14" fill="#6d28d9">live with every run.</text></g><text class="detail" x="70" y="414">Use the direct CLI or stay in your existing pytest workflow.</text><rect x="802" y="395" width="328" height="36" rx="18" fill="#e0e7ff"/><text x="966" y="418" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#3730a3">declarative tests • targeted setup • useful failures</text></svg>
