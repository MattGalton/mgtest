[tool.poetry]
name = "my_project"
version = "0.0.1"
description = "A pytest extension that allows for "
authors = ["Matt Galton <Matt.Galton@outlook.com>"]
readme = "README.md"
packages = [{ include = "my_project", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pytest = "^8.3"

[tool.poetry.group.dev.dependencies]
black = "^24.10"
ruff = "^0.6.8"
mypy = "^1.12.0"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = 3.12
strict = true