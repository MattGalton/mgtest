[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mgtest"
version = "0.1.0"
description = "Declarative, extensible system-test orchestration for pytest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6,<7", "pytest>=8.3,<10"]

[project.optional-dependencies]
hydra = ["hydra-core>=1.3,<2"]
dev = ["black>=24.10", "mypy>=1.12", "ruff>=0.6.8"]

[project.scripts]
mgtest = "mgtest.cli.main:main"
mgtest-schema = "mgtest.cli.mgtest_schema:main"

[project.entry-points.pytest11]
mgtest = "mgtest.engine.runner"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

